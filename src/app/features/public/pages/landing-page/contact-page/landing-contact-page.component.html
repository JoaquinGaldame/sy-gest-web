<app-landing-header></app-landing-header>
<section class="page-shell">
  <div class="hero" @fadeInUp>
    <div>
      <p class="eyebrow">Contacto</p>
      <h1>Hablemos sobre tu operación</h1>
      <p class="lead">
        Nuestro equipo responde en menos de 24 horas con un plan claro para tu
        implementación.
      </p>
    </div>
    <div class="contact-cards">
      <div>
        <h3>Ventas</h3>
        <p>ventas@sygest.com</p>
        <span>+54 11 5555 1234</span>
      </div>
      <div>
        <h3>Soporte</h3>
        <p>soporte@sygest.com</p>
        <span>+54 11 5555 5678</span>
      </div>
    </div>
  </div>

  <div class="form-wrapper" @fadeInUp>
    <h2>Cuéntanos sobre tu proyecto</h2>
    <form class="contact-form">
      <label>
        Nombre y apellido
        <input type="text" placeholder="Tu nombre" />
      </label>
      <label>
        Correo corporativo
        <input type="email" placeholder="correo@empresa.com" />
      </label>
      <label>
        Tamaño de empresa
        <select>
          <option>1-10 colaboradores</option>
          <option>11-50 colaboradores</option>
          <option>51-200 colaboradores</option>
          <option>+200 colaboradores</option>
        </select>
      </label>
      <label class="full">
        Mensaje
        <textarea rows="4" placeholder="Cuéntanos qué necesitas"></textarea>
      </label>
      <button type="submit">Enviar solicitud</button>
    </form>
  </div>
</section>
