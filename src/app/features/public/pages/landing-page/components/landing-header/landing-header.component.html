<header class="landing-header">
  <nav class="container mx-auto px-4 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <a class="logo-link" routerLink="/">
        <img
          src="assets/images/Logos/Simbolo-Logo.png"
          alt="Sy-Gest"
          class="logo-img"
        />
      </a>

      <!-- Navegación Desktop -->
      <div class="hidden items-center gap-8 md:flex">
        <a routerLink="/software" class="nav-link" routerLinkActive="is-active"
          >Software</a
        >
        <a routerLink="/guide" class="nav-link" routerLinkActive="is-active"
          >Guía</a
        >
        <a routerLink="/about" class="nav-link" routerLinkActive="is-active"
          >Nosotros</a
        >
        <a routerLink="/contact" class="nav-link" routerLinkActive="is-active"
          >Contacto</a
        >
      </div>

      <!-- Acciones -->
      <div class="flex items-center gap-4">
        <button
          pButton
          type="button"
          label="Acceder"
          icon="pi pi-user"
          class="p-button-text p-button-sm !text-primary"
          (click)="requestLogin()"
        >
          <span class="sr-only">Acceder</span>
        </button>
        <button
          pButton
          type="button"
          label="Demo Gratis"
          class="p-button-raised p-button-sm"
        >
          <span class="sr-only">Demo Gratis</span>
        </button>

        <!-- Menú móvil -->
        <button
          pButton
          type="button"
          icon="pi pi-bars"
          class="p-button-text p-button-rounded md:hidden"
          (click)="toggleMobileMenu()"
          aria-label="Abrir menú"
        >
          <span class="sr-only">Abrir menú</span>
        </button>
      </div>
    </div>

    <!-- Menú móvil -->
    @if (mobileMenuOpen) {
      <div class="mt-4 space-y-4 border-t pt-4 md:hidden">
        <a
          routerLink="/software"
          class="block py-2 text-lg font-medium"
          (click)="closeMobileMenu()"
          >Software</a
        >
        <a
          routerLink="/guide"
          class="block py-2 text-lg font-medium"
          (click)="closeMobileMenu()"
          >Guía</a
        >
        <a
          routerLink="/about"
          class="block py-2 text-lg font-medium"
          (click)="closeMobileMenu()"
          >Nosotros</a
        >
        <a
          routerLink="/contact"
          class="block py-2 text-lg font-medium"
          (click)="closeMobileMenu()"
          >Contacto</a
        >
      </div>
    }
  </nav>
</header>
